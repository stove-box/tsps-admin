<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSPS | Server Admin Panel</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <header class="server-bar">
    <div class="bar-left">
      <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Show servers" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <img class="logo" src="favicon.svg" alt="" width="26" height="26">
      <div class="title"><strong>TSPS</strong><span class="sep">|</span><span class="long">Server Admin Panel</span></div>
    </div>
    <div class="bar-right">
      <span id="summary" class="summary"></span>
      <span id="conn" class="conn" title="Live updates">connecting…</span>
      <button type="button" id="fetch" title="git fetch --all --prune">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" /></svg>
        Fetch
      </button>
      <button type="button" id="new" class="primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span class="label">New worktree</span>
      </button>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="group-label">Servers</div>
    <nav id="server-list" class="server-list" aria-label="Servers"></nav>
    <div id="activity-wrap" hidden>
      <div class="group-label">Activity</div>
      <div id="tasks" class="tasks"></div>
    </div>
  </aside>
  <button type="button" id="menu-backdrop" class="menu-backdrop" aria-label="Close servers menu" tabindex="-1" hidden></button>

  <main id="workspace" class="workspace">
    <section id="detail" class="detail"></section>

    <section class="logs" aria-label="Logs">
      <div class="logs-head">
        <h2>Console</h2>
        <input id="logs-filter" type="search" placeholder="Filter lines" aria-label="Filter log lines">
        <label class="toggle"><input id="logs-follow" type="checkbox" checked><span class="switch" aria-hidden="true"></span>Follow</label>
      </div>
      <pre id="logs-body" class="logs-body" tabindex="0"></pre>
    </section>
  </main>
</div>

<dialog id="new-dialog">
  <form method="dialog" id="new-form">
    <h2>New worktree</h2>
    <p class="muted">Runs <code>scripts/wt new</code>: creates <code>../tsps-&lt;branch&gt;</code>, gives it a port slot and copies <code>node_modules</code>. Copying can take a few minutes; progress shows under Activity.</p>
    <label>Branch <input type="text" name="branch" required placeholder="fix/my-change" autocomplete="off" spellcheck="false"></label>
    <label>Base <input type="text" name="base" placeholder="origin/main" autocomplete="off" spellcheck="false"></label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary">Create worktree</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="alert" hidden></div>
<script src="app.js"></script>
</body>
</html>
