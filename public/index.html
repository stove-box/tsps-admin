<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSPS | Server Admin Panel</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="preload" href="RuneScape-Bold-12.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <header class="top-bar">
    <div class="bar-left">
      <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Show worlds" aria-controls="switcher" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <img class="logo" src="favicon.svg" alt="" width="30" height="30">
      <div class="title"><strong>TSPS</strong><span class="sep">|</span><span class="long">Server Admin Panel</span></div>
    </div>
    <div class="bar-right">
      <span id="conn" class="conn">Connecting</span>
      <button type="button" id="panel-restart" class="stone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0" /></svg>
        <span class="label">Restart panel</span>
      </button>
      <button type="button" id="fetch" class="stone" aria-label="Check for updates">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
        <span class="label">Check for updates</span>
      </button>
    </div>
  </header>

  <aside id="switcher" class="switcher" aria-label="World Switcher">
    <div class="switcher-panel osrs">
      <div class="switcher-title">
        <button type="button" id="reorder" class="addr-btn icon-btn" aria-label="Reorder worlds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4" /></svg>
        </button>
        <h2 class="rs-title">World Switcher</h2>
        <button type="button" id="new" class="addr-btn icon-btn" aria-label="New world">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </div>
      <div class="switcher-head" aria-hidden="true">
        <span></span><span>World</span><span>Players</span><span>Activity</span>
      </div>
      <nav id="world-list" class="world-list"></nav>
      <div class="switcher-foot rs" id="total"></div>    </div>

    <section id="jobs-wrap" class="jobs-panel osrs" aria-labelledby="jobs-title" hidden>
      <div class="jobs-head">
        <h2 class="rs-title" id="jobs-title">Recent jobs</h2>
        <button type="button" id="jobs-clear" class="addr-btn">Clear</button>
      </div>
      <div id="jobs" class="jobs"></div>
    </section>
  </aside>
  <button type="button" id="menu-backdrop" class="menu-backdrop" aria-label="Close world list" tabindex="-1" hidden></button>

  <main class="workspace">
    <section id="world" class="world" aria-live="polite"></section>

    <section class="chatbox" aria-label="Console">
      <div id="chat-body" class="chat-body rs" tabindex="0"></div>
      <div class="chat-tabs" role="tablist" aria-label="Console filter">
        <button type="button" role="tab" data-filter="all" aria-selected="true">All</button>
        <button type="button" role="tab" data-filter="server">Game</button>
        <button type="button" role="tab" data-filter="client">Client</button>
        <button type="button" role="tab" data-filter="admin">Panel</button>
        <button type="button" role="tab" data-filter="error">Errors</button>
        <input id="chat-search" type="search" placeholder="Search" aria-label="Search console">
        <label class="osrs-check">
          <input id="chat-follow" type="checkbox" checked><span class="box" aria-hidden="true"></span><span>Follow</span>
        </label>
      </div>
    </section>
  </main>
</div>

<dialog id="new-dialog" class="osrs-dialog confirm-dialog new-dialog" aria-labelledby="new-title">
  <form method="dialog" id="new-form" novalidate>
    <h2 class="rs-title" id="new-title">Create a new world?</h2>
    <p class="new-intro">Give it a name and pick its world type.</p>
    <label for="new-name">Name</label>
    <input type="text" id="new-name" name="branch" placeholder="e.g. my-new-feature" autocomplete="off" spellcheck="false"
      aria-describedby="new-preview new-error">
    <p id="new-error" class="field-error" role="alert" hidden></p>
    <span class="field-label" id="new-type-label">World type</span>
    <button type="button" id="new-type" class="type-select" data-type-menu aria-haspopup="listbox"
      aria-labelledby="new-type-label new-type" aria-expanded="false" aria-controls="type-menu"></button>
    <div id="new-preview" class="new-preview" aria-live="polite"></div>
    <details class="advanced">
      <summary>Advanced</summary>
      <label for="new-base">Start from</label>
      <input type="text" id="new-base" name="base" placeholder="origin/main" autocomplete="off" spellcheck="false">
      <p class="new-note">Leave it empty to start from the latest main.</p>
    </details>
    <p class="new-note">Takes a few minutes; it opens here when ready.</p>
    <div class="confirm-actions">
      <button type="submit" value="ok" class="stone gold" id="new-create" disabled>Create world</button>
      <button type="button" class="stone" id="new-cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!-- XP rate: one field; the note says whether the world restarts to apply it. -->
<dialog id="xp-dialog" class="osrs-dialog confirm-dialog new-dialog" aria-labelledby="xp-title">
  <form method="dialog" id="xp-form" novalidate>
    <h2 class="rs-title" id="xp-title">Change the XP rate?</h2>
    <label for="xp-rate">XP rate</label>
    <input type="text" id="xp-rate" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="e.g. 5" aria-describedby="xp-error xp-note">
    <p id="xp-error" class="field-error" role="alert" hidden></p>
    <p id="xp-note" class="new-note"></p>
    <div class="confirm-actions">
      <button type="submit" value="ok" class="stone gold" id="xp-save" disabled>Change rate</button>
      <button type="button" class="stone" id="xp-cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!-- A job's output (Details in Recent jobs), in the dialogs' style; it follows a running job live. -->
<dialog id="job-dialog" class="osrs-dialog confirm-dialog job-dialog" aria-labelledby="job-title">
  <form method="dialog">
    <h2 class="rs-title" id="job-title"></h2>
    <p id="job-summary" class="job-summary"></p>
    <pre id="job-log" class="job-log-box" tabindex="0"></pre>
    <div class="confirm-actions single">
      <button value="close" class="stone">Close</button>
    </div>
  </form>
</dialog>

<!-- "Are you sure?" in the game's style: replaces the browser's confirm() box. -->
<dialog id="confirm-dialog" class="osrs-dialog confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
  <form method="dialog">
    <h2 class="rs-title" id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div id="confirm-card" class="new-preview confirm-card" hidden></div>
    <p id="confirm-note" class="confirm-note" hidden></p>
    <div id="confirm-more" class="confirm-more" hidden>
      <p class="warn-text" id="confirm-list-title"></p>
      <ul id="confirm-list" class="file-list"></ul>
      <label class="osrs-check"><input type="checkbox" id="confirm-check"><span class="box" aria-hidden="true"></span><span id="confirm-check-label"></span></label>
    </div>
    <div class="confirm-actions">
      <button value="yes" id="confirm-yes" class="stone red"></button>
      <button value="no" id="confirm-no" class="stone"></button>
    </div>
  </form>
</dialog>

<!-- The World type dropdown's list: outside #world so the 3 s redraw can't close it or steal focus. -->
<div id="type-menu" class="type-menu" role="listbox" aria-label="World type" tabindex="-1" hidden></div>

<div id="toast" class="toast" role="alert" hidden></div>
<script src="app.js"></script>
</body>
</html>
