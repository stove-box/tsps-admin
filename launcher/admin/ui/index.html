<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>TSPS Admin</title>
<style>
@font-face { font-family: "RuneScape Plain 12"; font-display: block; src: url("assets/RuneScape-Plain-12.ttf") format("truetype"); }
@font-face { font-family: "RuneScape Bold 12"; font-display: block; src: url("assets/RuneScape-Bold-12.ttf") format("truetype"); }
:root { --rs: "RuneScape Plain 12", system-ui, sans-serif; --rs-bold: "RuneScape Bold 12", system-ui, sans-serif; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 56px 16px 16px; user-select: none;
  background: radial-gradient(70% 60% at 50% 45%, #22201c, #16171a);
  font: 16px/1.3 var(--rs); color: #fff; text-shadow: 1px 1px 0 #000;
}
.osrs {
  width: min(480px, 100%); padding: 14px 16px 16px; border-radius: 3px; text-align: center;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255, 255, 255, .035), transparent 60%),
    repeating-linear-gradient(45deg, rgba(0, 0, 0, .05) 0 2px, transparent 2px 5px), #3e3529;
  border: 2px solid #0e0c09;
  box-shadow: inset 0 0 0 1px #5d5240, inset 0 0 0 3px #2b251c, 0 6px 18px rgba(0, 0, 0, .5);
}
h1 { margin: 0 0 10px; font: 16px/1.25 var(--rs-bold); font-weight: normal; color: #ff981f; }
/* The game's loading bar: a red bar filling a dark inset. */
.bar { position: relative; height: 30px; padding: 3px; background: #2b251c; border: 1px solid #0e0c09; border-radius: 2px;
  box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .55), 1px 1px 0 #5d5240; overflow: hidden; }
.fill { position: absolute; inset: 3px auto 3px 3px; width: 40%; background: linear-gradient(#a3201a, #8c1111); animation: sweep 1.6s ease-in-out infinite; }
@keyframes sweep { 0% { left: -40%; } 100% { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .fill { animation: none; left: 3px; width: calc(100% - 6px); opacity: .6; } }
#status { position: relative; display: grid; place-items: center; height: 100%; white-space: pre-line; }
/* Room for three lines, so the box keeps its size as tips change. */
.tip { margin: 14px 0 0; padding: 10px 14px 12px; min-height: calc(3 * 1.3em + 4px + 1.25em + 22px);
  display: flex; flex-direction: column; background: rgba(0, 0, 0, .22); border: 1px solid rgba(14, 12, 9, .8); border-radius: 2px; }
.tip strong { margin-bottom: 4px; font: 16px/1.25 var(--rs-bold); font-weight: normal; color: #ffff00; }
/* Even lines, no orphaned last word, and never wider than a comfortable reading line. */
.tip span { flex: 1; display: grid; place-items: center; max-width: 40ch; margin: 0 auto;
  color: #e8dcc0; text-wrap: balance; overflow-wrap: break-word; transition: opacity .3s; }
</style>
<main class="osrs">
  <h1>TSPS Admin</h1>
  <div class="bar" aria-hidden="true"><div class="fill"></div></div>
  <p id="status" role="status" style="margin: 8px 0 0">Starting TSPS Admin…</p>
  <p class="tip" aria-live="off"><strong>Did you know?</strong><span id="tip"></span></p>
</main>
<script>
// The game's own funnier login tips (oldschool.runescape.wiki/w/Did_you_know%3F), then ours in its voice.
const TIPS = [
  "If you stand on the same tile as your box trap, it will fail to catch 100% of the time.",
  "You can put two halves of a pizza together to make a whole pizza!",
  "You can try to catch most Hunter creatures below your Hunter level. You will fail every single time.",
  "The fire in the Ruins of Unkah counts as a range. Nobody knows who left it on.",
  "Logging out in combat does not, in fact, end the combat. It just ends you.",
  "Bankers have never once been seen leaving the bank. Nobody has asked why.",
  "Cows drop beef, cowhide and bones. They never drop the attitude.",
  "Players who say 'buying gf' are rarely buying anything.",
  "The Wise Old Man's beard contains at least three missing party hats.",
  "You can't run while carrying 0 energy. You can, however, still try.",
  "Chickens have no combat stats worth mentioning, and yet the feathers keep coming.",
  "If a goblin asks what colour armour to wear, the answer is always 'brown'. Or 'green'. It's complicated.",
  "Saving your worlds before quitting is good practice. So is not clicking 'Shut Down' by accident.",
  "Dropping a rune scimitar to 'test the lag' has never once gone well.",
  "Fishing spots move whenever you look away. They are aware of you.",
  "Every server restart is a fresh start, unless you forgot to save. Then it's a fresh start.",
  "Hans has been walking around the castle since launch. He has not been offered a chair.",
  "The quickest way to find a rare drop is to stop looking for it. Results may vary by several years.",
];
const tip = document.getElementById("tip");
let index = Math.floor(Math.random() * TIPS.length);
function next() {
  tip.style.opacity = 0;
  setTimeout(() => { tip.textContent = TIPS[index++ % TIPS.length]; tip.style.opacity = 1; }, 300);
}
tip.textContent = TIPS[index++ % TIPS.length];
setInterval(next, 6000);
</script>
</html>
